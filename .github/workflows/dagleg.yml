name: Dagleg oppdatering

# Kjelder blir oppdaterte gjennom dagen; Fiskeridirektoratet regenererer
# CSV-dumpen kvart døgn og gårsdagens fil er borte. Difor køyrer vi tidleg,
# og arkiverer før vi byggjer.
on:
  schedule:
    - cron: "20 5 * * *"      # 05:20 UTC = 07:20 norsk sommartid
  workflow_dispatch:           # og manuelt, frå Actions-fana

permissions:
  contents: write              # for å committe arkivet
  pages: write
  id-token: write

concurrency:
  group: dagleg
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Hent dagens snapshot
        run: ./scripts/snapshot.sh

      - name: Arkiver tilstanden
        run: npm run arkiver

      - name: Bygg datasettet
        run: npm run bygg

      - name: Bygg sida
        run: ./scripts/bygg-side.sh

      - name: Sjekk at sida faktisk blei bygd
        run: |
          test -s app/index.html || { echo "app/index.html manglar"; exit 1; }
          node scripts/sjekk-side.mjs app/index.html

      - name: Ta vare på arkivet
        run: |
          git config user.name  "oppdretter-bot"
          git config user.email "sgrimen06@gmail.com"
          git add data/arkiv
          if git diff --staged --quiet; then
            echo "ingen nye arkivfiler"
          else
            git commit -m "arkiv $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
